<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="AKV BG - Free background remover. Works in your browser, photos never leave your device.">
<title>AKV BG — Remove Background Free</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--sun:#FFD23F;--ink:#1E1B4B;--pink:#FF5C8A;--teal:#12C2A9;--blue:#4361EE;--white:#fff;--font:"Baloo Thambi 2","Noto Sans Tamil","Latha",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--sun);color:var(--ink);font:500 18px/1.45 var(--font)}
a,button,input{font-family:inherit}
:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
header{max-width:820px;margin:auto;padding:20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:28px}
.lang{display:flex;background:var(--white);border:3px solid var(--ink);border-radius:999px;padding:3px;box-shadow:3px 3px 0 var(--ink)}
.lang button{border:0;background:none;color:var(--ink);font-weight:700;font-size:16px;padding:4px 16px;border-radius:999px;cursor:pointer}
.lang button.on{background:var(--ink);color:var(--white)}
main{max-width:820px;margin:0 auto 40px;padding:0 18px}
h1{font-size:clamp(36px,8vw,60px);line-height:1.05;margin:10px 0 8px;font-weight:800;text-align:center}
.sub{text-align:center;font-weight:700;margin:0 0 24px}
.card{background:var(--white);border:4px solid var(--ink);border-radius:28px;padding:26px;box-shadow:10px 10px 0 var(--ink)}
.drop{display:block;border:4px dashed var(--ink);border-radius:20px;padding:34px 16px;text-align:center;font-weight:800;font-size:22px;background:#F3F1FF;cursor:pointer}
.drop.over{background:var(--pink)}
.drop small{display:block;font-weight:500;font-size:15px;margin-top:6px}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.status{min-height:26px;margin:14px 0 0;text-align:center;font-weight:700}
.status.err{color:#B3123B}
.bar{height:14px;border:3px solid var(--ink);border-radius:99px;overflow:hidden;margin-top:10px;display:none}
.bar i{display:block;height:100%;width:0;background:var(--pink);transition:width .2s}
.views{display:none;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.views.show{display:grid}
.pane{border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:#F3F1FF}
.pane figcaption{font-weight:800;padding:6px 12px;border-bottom:3px solid var(--ink);background:var(--white)}
.pane img{display:block;width:100%;height:auto;max-height:55vh;object-fit:contain}
#after{background:var(--bg,transparent)}
.checker{background:conic-gradient(#e6e3f7 25%,#fff 0 50%,#e6e3f7 0 75%,#fff 0) 0 0/20px 20px}
.tools{display:none;margin-top:18px;gap:10px;flex-wrap:wrap;align-items:center}
.tools.show{display:flex}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 4px var(--blue)}
.go{flex:1 1 180px;border:3px solid var(--ink);border-radius:16px;padding:12px 20px;background:var(--pink);color:var(--ink);font-weight:800;font-size:20px;box-shadow:4px 4px 0 var(--ink);cursor:pointer}
.go:active{transform:translate(4px,4px);box-shadow:none}
.fine{font-size:14px;text-align:center;margin:20px 0 0;color:#4A466F}
footer{text-align:center;font-weight:700;font-size:15px;padding:0 0 30px}
@media(max-width:560px){.views{grid-template-columns:1fr}.card{padding:18px 14px;box-shadow:6px 6px 0 var(--ink)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo">AKV BG</div>
  <div class="lang" role="group" aria-label="Language">
    <button id="en" class="on" type="button">English</button>
    <button id="ta" type="button">தமிழ்</button>
  </div>
</header>
<main>
  <h1 id="title">Remove image background</h1>
  <p class="sub" id="sub">Free. Private. Works on your phone.</p>
  <section class="card">
    <label class="drop" id="drop" for="file"><span id="dropText">Tap to choose a photo</span><small id="dropHint">or drag and drop here (JPG, PNG, WebP)</small>
      <input id="file" type="file" accept="image/png,image/jpeg,image/webp"></label>
    <div class="bar" id="bar"><i id="fill"></i></div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div class="views" id="views">
      <figure class="pane" style="margin:0"><figcaption id="capBefore">Original</figcaption><img id="before" alt=""></figure>
      <figure class="pane checker" style="margin:0"><figcaption id="capAfter">No background</figcaption><img id="after" alt=""></figure>
    </div>
    <div class="tools" id="tools">
      <button class="sw checker" data-c="" aria-label="Transparent" type="button"></button>
      <button class="sw" data-c="#ffffff" style="background:#fff" aria-label="White" type="button"></button>
      <button class="sw" data-c="#FFD23F" style="background:#FFD23F" aria-label="Yellow" type="button"></button>
      <button class="sw" data-c="#4361EE" style="background:#4361EE" aria-label="Blue" type="button"></button>
      <button class="sw" data-c="#1E1B4B" style="background:#1E1B4B" aria-label="Dark" type="button"></button>
      <button class="go" id="dl" type="button">Download PNG</button>
    </div>
    <p class="fine" id="fine">Your photo is processed inside your browser and is never uploaded. The first photo takes longer because the AI model downloads once.</p>
  </section>
</main>
<footer>© <span id="year"></span> AKV BG</footer>

<script type="module">
import { removeBackground } from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm";

const $ = id => document.getElementById(id);
const T = {
 en:{title:'Remove image background',sub:'Free. Private. Works on your phone.',drop:'Tap to choose a photo',hint:'or drag and drop here (JPG, PNG, WebP)',before:'Original',after:'No background',dl:'Download PNG',fine:'Your photo is processed inside your browser and is never uploaded. The first photo takes longer because the AI model downloads once.',load:'Loading AI model… ',work:'Removing background…',done:'Done! Pick a background or download.',bad:'Please choose a JPG, PNG or WebP image.',err:'Could not remove the background. Check your internet and try again.'},
 ta:{title:'Image Background நீக்குங்கள்',sub:'இலவசம். பாதுகாப்பானது. Phone-லேயே வேலை செய்யும்.',drop:'Photo தேர்ந்தெடுக்க தொடவும்',hint:'அல்லது இங்கே இழுத்து விடவும் (JPG, PNG, WebP)',before:'அசல்',after:'Background இல்லாமல்',dl:'PNG பதிவிறக்கு',fine:'உங்கள் photo உங்கள் browser-லேயே process ஆகும், எங்கும் upload ஆகாது. முதல் photo-க்கு AI model download ஆவதால் கொஞ்சம் நேரம் ஆகும்.',load:'AI model ஏறுகிறது… ',work:'Background நீக்கப்படுகிறது…',done:'முடிந்தது! Background தேர்ந்தெடுக்கவும் அல்லது download செய்யவும்.',bad:'JPG, PNG அல்லது WebP image தேர்ந்தெடுக்கவும்.',err:'Background நீக்க முடியவில்லை. Internet சரிபார்த்து மீண்டும் முயற்சிக்கவும்.'}
};
let lang='en', blob=null, color='', name='image';

function setLang(l){
  lang=l; const w=T[l]; document.documentElement.lang=l;
  $('title').textContent=w.title; $('sub').textContent=w.sub; $('dropText').textContent=w.drop;
  $('dropHint').textContent=w.hint; $('capBefore').textContent=w.before; $('capAfter').textContent=w.after;
  $('dl').textContent=w.dl; $('fine').textContent=w.fine;
  $('en').classList.toggle('on',l==='en'); $('ta').classList.toggle('on',l==='ta');
}
$('en').onclick=()=>setLang('en'); $('ta').onclick=()=>setLang('ta');
$('year').textContent=new Date().getFullYear();

function msg(t,err){ $('status').textContent=t; $('status').className='status'+(err?' err':''); }

async function handle(file){
  if(!file||!/^image\/(png|jpeg|webp)$/.test(file.type)){ msg(T[lang].bad,true); return; }
  name=file.name.replace(/\.[^.]+$/,'')||'image';
  $('before').src=URL.createObjectURL(file);
  $('views').classList.add('show'); $('tools').classList.remove('show');
  $('after').removeAttribute('src');
  $('bar').style.display='block'; $('fill').style.width='5%'; msg(T[lang].load);
  try{
    blob = await removeBackground(file,{
      output:{format:'image/png'},
      progress:(key,cur,total)=>{
        if(total){ const p=Math.round(cur/total*100); $('fill').style.width=Math.max(5,p)+'%';
          msg(key.startsWith('fetch')?T[lang].load+p+'%':T[lang].work); }
      }
    });
    $('fill').style.width='100%';
    $('after').src=URL.createObjectURL(blob);
    setColor('');
    $('tools').classList.add('show');
    msg(T[lang].done);
  }catch(e){ console.error(e); msg(T[lang].err,true); }
  finally{ setTimeout(()=>{$('bar').style.display='none'},600); }
}

function setColor(c){
  color=c; $('after').style.setProperty('--bg',c||'transparent');
  document.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',b.dataset.c===c));
}
document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>setColor(b.dataset.c));

$('file').onchange=e=>handle(e.target.files[0]);
const d=$('drop');
['dragenter','dragover'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add('over')}));
['dragleave','drop'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove('over')}));
d.addEventListener('drop',e=>handle(e.dataTransfer.files[0]));

$('dl').onclick=async()=>{
  if(!blob) return;
  let out=blob;
  if(color){
    const img=await createImageBitmap(blob);
    const c=document.createElement('canvas'); c.width=img.width; c.height=img.height;
    const x=c.getContext('2d'); x.fillStyle=color; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0);
    out=await new Promise(r=>c.toBlob(r,'image/png'));
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(out); a.download=name+'-nobg.png';
  document.body.appendChild(a); a.click(); a.remove();
};
</script>
</body>
</html>
